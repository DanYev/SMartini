# Build system dependencies ----------

[build-system]
requires = [
    "poetry-core>=1.8.0",
    "setuptools",
    "wheel",
    "Cython>=0.29.21",
    "numpy",
]
build-backend = "poetry.core.masonry.api"

# Project package metadata ----------

[tool.poetry]
name = "smartini"
version = "0.2.0"
description = "Small Molecule parametrization pipeline for Martini 3 Force Field"
readme = "README.md"
packages = [{ include = "smartini" }]
exclude = [
    "*/tests/",
    "*/cgmd_params/",
]
include = [
    { path = "smartini/optimization_cy.pyx", format = "wheel" },
    { path = "smartini/ligpar_cy.pyx", format = "wheel" },
    { path = "smartini/*.so", format = "wheel" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Cython",
]
homepage = "https://github.com/DanYev/SMartini"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
beautifulsoup4 = ">=4.11.1"
cython = ">=0.29.21"
mdanalysis = ">=2.0.0"
matplotlib = ">=3.6.0"
numpy = ">=1.23.1"
openff-interchange = ">=0.5.0"
openff-toolkit = ">=0.19.0"
openmm = ">=8.0.0"
openmmforcefields = ">=0.16.0"
pyyaml = ">=6.0.0"
rdkit = ">=2022.03.4"
requests = ">=2.28.1"
scikit-learn = ">=1.1.0"
six = ">=1.16.0"
lxml = ">=4.9.1"

[tool.poetry.group.dev.dependencies]
black = ">=24.0.0"
flake8 = ">=7.0.0"
flake8-bugbear = ">=24.0.0"
flake8-comprehensions = ">=3.8.0"
flake8-logging-format = ">=0.6.0"
flake8-mutable = ">=1.2.0"
isort = ">=5.10.1"
pytest = ">=7.0.0"
pytest-cov = ">=5.0.0"

# Black formatting parameters
[tool.black]
line-length = 99

# Coverage settings
[tool.coverage.run]
branch = true
source = ["smartini"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "pytest.mark.skip",
]
omit = [
    "tests/*",
    "cgmd_params/*",
]
show_missing = true
fail_under = 0

# Isort settings
[tool.isort]
profile = "black"

# Pytest options
[tool.pytest.ini_options]
xfail_strict = true
testpaths = ["tests"]
